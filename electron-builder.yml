appId: 'kr.modakbul.season1.launcher'
productName: '모닥불 Season 1'
artifactName: 'Modakbul-Season-1-setup-${version}.${ext}'

copyright: 'Copyright © 2026 모닥불 Season 1 운영팀'

asar: true
compression: 'maximum'

files:
  - '**/*'
  # electron-builder normally discovers production dependencies itself.  The
  # portable build environment used for this launcher can skip that discovery,
  # leaving app.asar without runtime modules.  build-electron.js prepares the
  # exact production dependency closure in runtime_node_modules instead.
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs,runtime_node_modules}'
  - from: 'runtime_node_modules'
    to: 'node_modules'
    filter:
      - '**/*'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  # Keep resource editing enabled so Windows receives the custom icon and product
  # metadata. No signing certificate is configured for this release.
  icon: 'build/icon.png'
  signAndEditExecutable: true
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: '모닥불 Season 1'

# macOS Configuration
mac:
  icon: 'build/icon-mac.png'
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target: 'AppImage'
  maintainer: '모닥불 Season 1 운영팀'
  vendor: '모닥불 Season 1'
  synopsis: '모닥불 Season 1 전용 Minecraft 런처'
  description: '모드, 설정, 리소스팩과 업데이트를 자동으로 관리하는 모닥불 Season 1 전용 런처입니다.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'
